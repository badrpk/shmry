<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shmry Admin Authentication</title>
        <meta name="description" content="Secure admin access to Shmry platform">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/shmry-theme.css">
        
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--darker);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4ECDC4;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4ECDC4;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-help {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }
        
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.3);
        }
        
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #fca5a5;
            text-align: center;
            display: none;
        }
        
        .success-message {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #86efac;
            text-align: center;
            display: none;
        }
        
        .security-info {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .security-info h4 {
            color: #4ECDC4;
            margin-bottom: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4ECDC4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .logo-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <div class="logo-icon">🚀</div>
            <h1 class="title">Shmry Admin</h1>
            <p class="subtitle">Secure Platform Access</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="authForm" onsubmit="authenticate(event)">
            <div class="form-group">
                <label for="adminId" class="form-label">Admin ID</label>
                <input type="text" id="adminId" class="form-input" placeholder="Enter Admin ID" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter Password" required>
            </div>
            
            <div class="form-group" id="masterQuestionGroup" style="display: none;">
                <label for="masterAnswer" class="form-label">What is your favourite?</label>
                <input type="text" id="masterAnswer" class="form-input" placeholder="Enter your answer">
                <small class="form-help">Master admin verification required</small>
            </div>
            
            <button type="submit" class="auth-btn" id="authButton">
                🔐 Authenticate
            </button>
        </form>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verifying credentials...</p>
        </div>
        
        <div class="security-info">
            <h4>🔒 Security Features</h4>
            <ul style="margin-left: 20px; opacity: 0.9;">
                <li>Multi-device authentication</li>
                <li>Source code backup across devices</li>
                <li>Encrypted admin access</li>
                <li>Redundant device management</li>
            </ul>
        </div>
    </div>

    <script>
        // Admin credentials (in production, these would be hashed and stored securely)
        const ADMIN_CREDENTIALS = {
            adminId: 'badrpk',
            password: 'Karachi5846$'
        };

        const MASTER_ADMIN_ANSWERS = ['Adolf Hitler', 'Bertrand Russel'];
        
        // Authentication function
        function authenticate(event) {
            event.preventDefault();
            
            const adminId = document.getElementById('adminId').value.trim();
            const password = document.getElementById('password').value;
            const masterAnswer = document.getElementById('masterAnswer').value.trim();
            const authButton = document.getElementById('authButton');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const masterQuestionGroup = document.getElementById('masterQuestionGroup');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Check if this is a master admin login attempt
            if (adminId === ADMIN_CREDENTIALS.adminId && password === ADMIN_CREDENTIALS.password) {
                // Check if master question is visible
                if (masterQuestionGroup.style.display === 'none') {
                    // First time login - show master question
                    masterQuestionGroup.style.display = 'block';
                    document.getElementById('masterAnswer').focus();
                    loading.style.display = 'none';
                    authButton.disabled = false;
                    authButton.textContent = '🔐 Master Admin Verification';
                    return;
                }
                
                // Master question is visible - validate answer
                if (!masterAnswer) {
                    errorMessage.textContent = '❌ Please answer the master admin question';
                    errorMessage.style.display = 'block';
                    loading.style.display = 'none';
                    authButton.disabled = false;
                    authButton.textContent = '🔐 Authenticate';
                    return;
                }
                
                if (!MASTER_ADMIN_ANSWERS.includes(masterAnswer)) {
                    errorMessage.textContent = '❌ Incorrect master admin answer';
                    errorMessage.style.display = 'block';
                    loading.style.display = 'none';
                    authButton.disabled = false;
                    authButton.textContent = '🔐 Authenticate';
                    return;
                }
                
                // Master admin authentication successful
                successMessage.textContent = '✅ Master Admin Access Granted! Redirecting to admin dashboard...';
                successMessage.style.display = 'block';
                
                localStorage.setItem('shmryAdminAuthenticated', 'true');
                localStorage.setItem('shmryAdminId', adminId);
                localStorage.setItem('shmryAuthTimestamp', Date.now().toString());
                localStorage.setItem('shmryMasterAdmin', 'true');
                
                setTimeout(() => {
                    window.location.href = '/admin/dashboard';
                }, 2000);
                return;
            }
            
            // Show loading
            loading.style.display = 'block';
            authButton.disabled = true;
            authButton.textContent = 'Verifying...';
            
            // Simulate authentication delay
            setTimeout(() => {
                if (adminId === ADMIN_CREDENTIALS.adminId && password === ADMIN_CREDENTIALS.password) {
                    // Regular admin login (should not reach here if master question is shown)
                    successMessage.textContent = '✅ Authentication successful! Redirecting to admin dashboard...';
                    successMessage.style.display = 'block';
                    
                    localStorage.setItem('shmryAdminAuthenticated', 'true');
                    localStorage.setItem('shmryAdminId', adminId);
                    localStorage.setItem('shmryAuthTimestamp', Date.now().toString());
                    
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 2000);
                    
                } else {
                    // Authentication failed
                    errorMessage.textContent = '❌ Invalid Admin ID or Password. Please try again.';
                    errorMessage.style.display = 'block';
                    
                    // Clear password field
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
                
                // Hide loading and reset button
                loading.style.display = 'none';
                authButton.disabled = false;
                authButton.textContent = '🔐 Authenticate';
            }, 1500);
        }
        
        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', function() {
            const isAuthenticated = localStorage.getItem('shmryAdminAuthenticated');
            const authTimestamp = localStorage.getItem('shmryAuthTimestamp');
            
            if (isAuthenticated === 'true' && authTimestamp) {
                const now = Date.now();
                const authTime = parseInt(authTimestamp);
                const sessionDuration = 24 * 60 * 60 * 1000; // 24 hours
                
                if (now - authTime < sessionDuration) {
                    // Still authenticated, redirect to dashboard
                    window.location.href = '/admin/dashboard';
                } else {
                    // Session expired, clear authentication
                    localStorage.removeItem('shmryAdminAuthenticated');
                    localStorage.removeItem('shmryAdminId');
                    localStorage.removeItem('shmryAuthTimestamp');
                }
            }
        });
        
        // Auto-focus on admin ID field
        document.getElementById('adminId').focus();
    </script>
</body>
</html>
