<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shmry Platform - Complete AI & Cloud Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .header h1 {
            color: #1a1a2e;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            color: #666;
            font-size: 1.2rem;
        }
        
        .shmry-logo {
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 1rem;
        }
        
        .cluster-status {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        
        .status-title {
            font-size: 1.8rem;
            color: #333;
            font-weight: 600;
        }
        
        .cluster-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .device-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 2rem;
            border-left: 6px solid #e94560;
            position: relative;
            overflow: hidden;
        }
        
        .device-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        
        .device-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a1a2e;
        }
        
        .device-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        .resource-item {
            background: white;
            padding: 1rem;
            border-radius: 15px;
            border: 1px solid #e9ecef;
        }
        
        .resource-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .resource-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }
        
        .resource-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .resource-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12);
            transition: width 0.3s ease;
        }
        
        .resource-fill.warning {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }
        
        .resource-fill.danger {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }
        
        .cluster-controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .control-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .btn {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: #1a1a2e;
            color: white;
        }
        
        .btn-primary:hover {
            background: #16213e;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background: #229954;
            transform: translateY(-2px);
        }
        
        .btn-warning {
            background: #f39c12;
            color: #333;
        }
        
        .btn-warning:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .performance-metrics {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .metrics-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        
        .metric-card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        
        .metric-icon {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 1rem;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .metric-label {
            font-size: 1rem;
            color: #666;
        }
        
        .logs-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .logs-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .log-entry {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border-left: 3px solid #e94560;
        }
        
        .log-time {
            color: #666;
            font-size: 0.8rem;
        }
        
        .log-message {
            color: #333;
            margin-top: 0.25rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-success {
            background: #27ae60;
        }
        
        .notification-error {
            background: #e74c3c;
        }
        
        .notification-warning {
            background: #f39c12;
            color: #333;
        }
        
        .device-ip {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
        }
        
        .resource-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        
        .resource-percentage {
            font-size: 0.8rem;
            color: #666;
        }
        
        .shmry-modules {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .modules-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .module-card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 15px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        
        .module-name {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }
        
        .module-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }
        
        .module-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        
        .status-planned {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .status-active {
            background: #e8f5e8;
            color: #388e3c;
        }
        
        .status-development {
            background: #fff3e0;
            color: #f57c00;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .devices-grid {
                grid-template-columns: 1fr;
            }
            
            .resources-grid {
                grid-template-columns: 1fr;
            }
            
            .control-buttons {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .modules-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="shmry-logo">🚀</div>
            <h1>Shmry Platform Dashboard</h1>
            <p>Complete AI & Cloud Platform</p>
        </div>
        
        <!-- Cluster Status -->
        <div class="cluster-status">
            <div class="status-header">
                <h2 class="status-title">Edge Computing Cluster Status</h2>
                <div class="cluster-indicator" id="clusterStatus">
                    <i class="fas fa-circle"></i>
                    <span>Initializing Shmry Edge...</span>
                </div>
            </div>
            
            <div class="devices-grid" id="devicesGrid">
                <!-- Device cards will be loaded here -->
            </div>
        </div>
        
        <!-- Shmry Modules Overview -->
        <div class="shmry-modules">
            <h2 class="modules-title">Shmry Platform Services</h2>
            <div class="modules-grid" id="modulesGrid">
                <!-- Module cards will be loaded here -->
            </div>
        </div>
        
        <!-- Cluster Controls -->
        <div class="cluster-controls">
            <h2 class="control-title">Edge Computing Management</h2>
            <div class="control-buttons">
                <button class="btn btn-success" onclick="startCluster()">
                    <i class="fas fa-play"></i> Start Edge Cluster
                </button>
                <button class="btn btn-warning" onclick="stopCluster()">
                    <i class="fas fa-stop"></i> Stop Edge Cluster
                </button>
                <button class="btn btn-primary" onclick="restartCluster()">
                    <i class="fas fa-redo"></i> Restart Edge Cluster
                </button>
                <button class="btn btn-danger" onclick="emergencyMode()">
                    <i class="fas fa-exclamation-triangle"></i> Emergency Mode
                </button>
                <button class="btn btn-primary" onclick="optimizeCluster()">
                    <i class="fas fa-cogs"></i> Optimize Resources
                </button>
                <button class="btn btn-success" onclick="syncDevices()">
                    <i class="fas fa-sync"></i> Sync All Devices
                </button>
            </div>
        </div>
        
        <!-- Performance Metrics -->
        <div class="performance-metrics">
            <h2 class="metrics-title">Edge Computing Performance</h2>
            <div class="metrics-grid" id="metricsGrid">
                <!-- Performance metrics will be loaded here -->
            </div>
        </div>
        
        <!-- Logs Panel -->
        <div class="logs-panel">
            <h2 class="logs-title">Edge Computing Logs</h2>
            <div id="logsList">
                <!-- Logs will be displayed here -->
            </div>
        </div>
    </div>
    
    <!-- Notification System -->
    <div id="notification" class="notification"></div>
    
    <script src="shmry-edge-computing.js"></script>
</body>
</html>
