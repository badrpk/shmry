<!DOCTYPE html>
<html>
<head>
    <title>SHMRY Launcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e3c72;
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .launcher {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
        }
        .button {
            display: block;
            width: 100%;
            margin: 20px 0;
            padding: 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .button:hover {
            background: #764ba2;
            transform: translateY(-3px);
        }
        .master { background: #1e3c72; }
        .storage { background: #28a745; }
        .search { background: #fd7e14; }
    </style>
</head>
<body>
    <div class="launcher">
        <h1>🚀 SHMRY</h1>
        <p style="font-size: 1.2rem; margin-bottom: 30px;">Choose your dashboard:</p>
        
        <a href="docs/index.html" class="button master">
            🎛️ Master Admin Dashboard
        </a>
        
        <a href="admin-dashboard.html" class="button storage">
            💾 Smart Storage Dashboard
        </a>
        
        <a href="search/index.html" class="button search">
            🔍 Search Engine
        </a>
        
        <p style="margin-top: 40px; opacity: 0.8;">
            Click any button above to open the dashboard
        </p>
    </div>
</body>
</html>
