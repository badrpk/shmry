<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHMRY Dashboards - Direct Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .dashboard-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .dashboard-link {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .dashboard-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .dashboard-link.master {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .dashboard-link.storage {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .dashboard-link.search {
            background: linear-gradient(135deg, #fd7e14, #ffc107);
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }

        .instructions h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }

        .instructions p {
            font-size: 0.9rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>SHMRY Dashboards</h1>
        <p>Direct Access - No Shortcuts Needed!</p>
        
        <div class="dashboard-links">
            <a href="master-admin-dashboard.html" class="dashboard-link master">
                <span class="icon">🎛️</span>
                Master Admin Dashboard
            </a>
            
            <a href="admin-dashboard.html" class="dashboard-link storage">
                <span class="icon">💾</span>
                Smart Storage Dashboard
            </a>
            
            <a href="search/index.html" class="dashboard-link search">
                <span class="icon">🔍</span>
                Search Engine
            </a>
        </div>

        <div class="instructions">
            <h3>💡 How to Use</h3>
            <p>1. Click any dashboard button above</p>
            <p>2. It will open in a new tab/window</p>
            <p>3. Bookmark this page for quick access</p>
            <p>4. No more shortcut issues!</p>
        </div>
    </div>

    <script>
        // Add click effects
        document.querySelectorAll('.dashboard-link').forEach(link => {
            link.addEventListener('click', function(e) {
                // Add click effect
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });

        // Show success message when page loads
        console.log('🚀 SHMRY Dashboards loaded successfully!');
        console.log('Click any dashboard button to get started.');
    </script>
</body>
</html>
