<!DOCTYPE html>
<html>
<head>
    <title>SHMRY - Main Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e3c72;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .dashboard-btn {
            display: block;
            width: 100%;
            padding: 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .dashboard-btn:hover {
            background: #764ba2;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .master { background: #1e3c72; }
        .storage { background: #28a745; }
        .search { background: #fd7e14; }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
        }
        .info h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }
        .info p {
            margin: 10px 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SHMRY</h1>
        <p class="subtitle">Edge Computing & AI Platform</p>
        
        <div class="dashboard-grid">
            <a href="master-admin-dashboard.html" class="dashboard-btn master">
                🎛️ Master Admin Dashboard
            </a>
            
            <a href="admin-dashboard.html" class="dashboard-btn storage">
                💾 Smart Storage Dashboard
            </a>
            
            <a href="search/index.html" class="dashboard-btn search">
                🔍 AI Search Engine
            </a>
        </div>
        
        <div class="info">
            <h3>💡 Quick Access</h3>
            <p>• Click any button above to open the dashboard</p>
            <p>• All dashboards are fully functional</p>
            <p>• No more shortcut issues!</p>
        </div>
    </div>
</body>
</html>
